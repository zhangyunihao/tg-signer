name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  # 供 publish.yml 复用：tag push 不会命中上面的 branches 触发器，
  # 因此发版时只会通过 workflow_call 跑一次 lint + pytest。
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 测试会导入 tg_signer.webui.app，必须安装 nicegui（gui extra）；
          # 只装核心依赖会导致 collection 阶段 ModuleNotFoundError。
          python -m pip install ".[gui,yaml]"
          python -m pip install --group dev
      - name: Lint
        run: |
          ruff check

      - name: Run tests
        run: |
          pytest -W=ignore::DeprecationWarning:pyrogram.sync -vv tests/
