name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  # 供 publish.yml 复用：tag push 不会命中上面的 branches 触发器，
  # 因此发版时只会通过 workflow_call 跑一次 lint + pytest。
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 测试会导入 tg_signer.webui.app，必须安装 nicegui（gui extra）；
          # 只装核心依赖会导致 collection 阶段 ModuleNotFoundError。
          python -m pip install ".[gui,yaml]"
          python -m pip install --group dev
      - name: Lint
        run: |
          ruff check

      - name: Run tests
        run: |
          pytest -W=ignore::DeprecationWarning:pyrogram.sync -vv tests/

  ui-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,yaml]"
          python -m pip install --group dev
          python -m pip install playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run WebUI regression
        run: |
          python scripts/ui_check.py --full --server-python python --timeout 60

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-artifacts
          path: |
            artifacts/ui-baseline
            tests/e2e/ui_baseline.json
          if-no-files-found: warn
          retention-days: 14
